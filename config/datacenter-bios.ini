; windows-openstack-imaging-tools configuration (Windows host path).
; Windows Server 2022 Datacenter, BIOS disk layout, qcow2 for OpenStack/Proxmox KVM.
; Option reference: Config.psm1 in https://github.com/cloudbase/windows-openstack-imaging-tools
; scripts/build-all-editions.ps1 overrides wim_file_path, image_path,
; virtio_iso_path and the Cloudbase-Init paths with absolute paths.
; The Linux path (Packer, scripts/build.sh) does not read these files.

[DEFAULT]
; install.wim of the MOUNTED Windows Server ISO, not the ISO itself.
wim_file_path = D:\Sources\install.wim
; Must match a Name listed by Get-WimFileImagesInfo (Desktop Experience).
image_name = Windows Server 2022 SERVERDATACENTER
image_path = C:\oic\output\windows-server-2022-datacenter-bios.qcow2
virtual_disk_format = QCOW2
image_type = KVM
disk_layout = BIOS
; Empty for evaluation media. default_kms_key uses the public KMS client
; key (GVLK) and only fits volume license media with a KMS server.
product_key =
shrink_image_to_minimum_size = True
compress_qcow2 = True
zero_unused_volume_sectors = True
enable_ping_requests = True
enable_ipv6_eui64 = True
enable_active_mode = True
enable_shutdown_without_logon = True

[vm]
; Build time only; Cloudbase-Init sets the instance password at first boot.
administrator_password = Pa$$w0rd
; Hyper-V switch with Internet access (Windows Update, Cloudbase-Init MSI).
external_switch = external
cpu_count = 4
ram_size = 8589934592
disk_size = 42949672960
disable_secure_boot = True

[drivers]
virtio_iso_path = C:\oic\virtio-win.iso

[custom]
install_qemu_ga = True
time_zone = UTC
ntp_servers = time.windows.com

[updates]
install_updates = True
purge_updates = True
clean_updates_online = True

[sysprep]
run_sysprep = True
disable_swap = False
persist_drivers_install = True

[cloudbase_init]
beta_release = False
serial_logging_port = COM1
cloudbase_init_config_path = config\cloud\cloudbase-init.conf
cloudbase_init_unattended_config_path = config\cloud\cloudbase-init-unattend.conf
cloudbase_init_use_local_system = False
cloudbase_init_delayed_start = False
