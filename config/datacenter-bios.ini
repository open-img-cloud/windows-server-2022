[DEFAULT]
wim_file_path = D:\ISO\WindowsServer2022.iso
image_name = Windows Server 2022 SERVERDATACENTER
image_path = D:\Images\win2022-datacenter-bios.qcow2
virtual_disk_format = QCOW2
image_type = KVM
disk_layout = BIOS
product_key = default_kms_key
shrink_image_to_minimum_size = True
compress_qcow2 = True
zero_unused_volume_sectors = True
enable_ping_requests = True
enable_ipv6_eui64 = True
enable_active_mode = True
msi_path = D:\CloudbaseInit\CloudbaseInitSetup.msi
cloudbase_init_config_path = config\cloud\cloudbase-init.conf
cloudbase_init_unattended_config_path = config\cloud\cloudbase-init-unattend.conf
cloudbase_init_use_local_system = False
cloudbase_init_delayed_start = False
custom_scripts_path = scripts
custom_resources_path = resources

[vm]
administrator_password = Pa$$w0rd
external_switch = external
cpu_count = 4
ram_size = 8589934592
disk_size = 64424509440
disable_secure_boot = True

[drivers]
virtio_iso_path = D:\Drivers\virtio-win.iso

[custom]
install_qemu_ga = True
time_zone = UTC
ntp_servers = time.windows.com

[updates]
install_updates = True
purge_updates = True
clean_updates_online = True

[sysprep]
run_sysprep = True
unattend_xml_path = unattended\Autounattend.xml
disable_swap = False
persist_drivers_install = True

[cloudbase_init]
serial_logging_port = COM1
