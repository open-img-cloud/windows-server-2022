# Cloudbase-Init, normal stage (Windows service, runs at every boot).
# Copied to C:\Program Files\Cloudbase Solutions\Cloudbase-Init\conf\ by
# scripts/guest/install-cloudbase-init.ps1 (Packer path) or by the
# windows-openstack-imaging-tools (cloudbase_init_config_path).
# Reference: https://cloudbase-init.readthedocs.io/en/latest/config.html
[DEFAULT]
# Account managed by Cloudbase-Init: the built-in Administrator.
username=Administrator
groups=Administrators
# Accept the password from the metadata (Nova admin_pass, Proxmox cipassword);
# otherwise SetUserPasswordPlugin generates a random one and, on OpenStack,
# posts it encrypted with the instance key pair (nova get-password).
inject_user_password=true
first_logon_behaviour=no

# Config drive lookup: CD-ROM, raw disk and vfat partition (OpenStack
# config drive, Proxmox "configdrive2" cloud-init drive).
config_drive_cdrom=true
config_drive_raw_hhd=true
config_drive_vfat=true
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\

verbose=true
debug=false
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=COM1,115200,N,8

mtu_use_dhcp_config=true
ntp_use_dhcp_config=true
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
check_latest_version=false
# Reboots requested by plugins (hostname change, ...) are allowed in the
# normal stage.
allow_reboot=true

# Config drive first: it needs no network, and it is the only source on
# Proxmox. Then the OpenStack metadata API (HttpService) and EC2 as fallback.
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,cloudbaseinit.metadata.services.httpservice.HttpService,cloudbaseinit.metadata.services.ec2service.EC2Service

# Upstream default plugin list.
# WindowsLicensingPlugin only activates Windows when activate_windows=true
# (with kms_host for a KMS server): activation is the operator's job.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.windows.ntpclient.NTPClientPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.createuser.CreateUserPlugin,cloudbaseinit.plugins.common.networkconfig.NetworkConfigPlugin,cloudbaseinit.plugins.windows.licensing.WindowsLicensingPlugin,cloudbaseinit.plugins.common.sshpublickeys.SetUserSSHPublicKeysPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin,cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,cloudbaseinit.plugins.windows.winrmlistener.ConfigWinRMListenerPlugin,cloudbaseinit.plugins.windows.winrmcertificateauth.ConfigWinRMCertificateAuthPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin
